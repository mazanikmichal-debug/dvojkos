name: Build Dvojkos EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.py"
      - ".github/workflows/build.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller

      - name: Build onefile exe
        run: |
          pyinstaller --onefile --windowed --name Dvojkos main.py
        working-directory: dvojkos-pygame

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dvojkos-Windows
          path: dvojkos-pygame/dist/Dvojkos.exe
